name: Build Windows EXE (v5.2.4)
run-name: Windows ${{ github.event.inputs.app_version || '5.2.4+69' }} ${{ github.event.inputs.release_channel || 'stable' }} EXE

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel for this Windows package'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - internal
      app_version:
        description: 'Flutter app version, for example 5.2.4+69'
        required: true
        default: '5.2.4+69'
        type: string
      release_label:
        description: 'Human label such as Beta 1 or Stable'
        required: false
        default: 'Stable'
        type: string
      release_number:
        description: 'Beta/internal sequence number'
        required: false
        default: '1'
        type: string

jobs:
  build:
    name: Build AutoTeleprompter for Windows
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Resolve Release Metadata
        id: release
        shell: pwsh
        env:
          INPUT_RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
          INPUT_APP_VERSION: ${{ github.event.inputs.app_version }}
          INPUT_RELEASE_NUMBER: ${{ github.event.inputs.release_number }}
          INPUT_RELEASE_LABEL: ${{ github.event.inputs.release_label }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseChannel = [string]$env:INPUT_RELEASE_CHANNEL
          if ([string]::IsNullOrWhiteSpace($releaseChannel)) {
            $releaseChannel = "stable"
          }
          $releaseChannel = $releaseChannel.Trim().ToLowerInvariant()
          if (@("stable", "beta", "internal") -notcontains $releaseChannel) {
            throw "Unsupported release_channel '$releaseChannel'."
          }

          $appVersion = [string]$env:INPUT_APP_VERSION
          if ([string]::IsNullOrWhiteSpace($appVersion)) {
            $appVersion = "5.2.4+69"
          }
          $appVersion = $appVersion.Trim()
          if ($appVersion -notmatch '^\d+\.\d+\.\d+\+\d+$') {
            throw "app_version must look like 5.2.4+69."
          }
          $versionName = ($appVersion -split '\+', 2)[0]

          $releaseNumber = [string]$env:INPUT_RELEASE_NUMBER
          if ([string]::IsNullOrWhiteSpace($releaseNumber)) {
            $releaseNumber = "1"
          }
          $releaseNumber = $releaseNumber.Trim()
          if ($releaseNumber -notmatch '^\d+$') {
            throw "release_number must be a positive integer."
          }

          $releaseLabel = [string]$env:INPUT_RELEASE_LABEL
          if ([string]::IsNullOrWhiteSpace($releaseLabel)) {
            if ($releaseChannel -eq "stable") {
              $releaseLabel = "Stable"
            } elseif ($releaseChannel -eq "internal") {
              $releaseLabel = "Internal $releaseNumber"
            } else {
              $releaseLabel = "Beta $releaseNumber"
            }
          }
          $releaseLabel = $releaseLabel.Trim()

          if ($releaseChannel -eq "stable") {
            $tag = "windows-v$versionName"
            $title = "AutoTeleprompter Windows v$versionName"
            $preRelease = "false"
          } elseif ($releaseChannel -eq "internal") {
            $tag = "windows-v$versionName-internal.$releaseNumber"
            $title = "AutoTeleprompter Windows v$versionName Internal $releaseNumber"
            $preRelease = "true"
          } else {
            $tag = "windows-v$versionName-beta.$releaseNumber"
            $title = "AutoTeleprompter Windows v$versionName Beta $releaseNumber"
            $preRelease = "true"
          }

          $publicRepo = "abprogroup/AutoTeleprompter-Releases"
          $internalRepo = "abprogroup/AutoTeleprompter-Internal-Releases"
          $releaseRepo = if ($releaseChannel -eq "internal") { $internalRepo } else { $publicRepo }
          $assetName = "AutoTeleprompter-Windows-$tag.zip"
          $manifestTag = "windows-update-manifest"
          $manifestAsset = "windows-update-manifest.json"
          $manifestUrl = "https://github.com/$releaseRepo/releases/download/$manifestTag/$manifestAsset"

          "release_channel=$releaseChannel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version_name=$versionName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_number=$releaseNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_label=$releaseLabel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pre_release=$preRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_repo=$releaseRepo" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest_tag=$manifestTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest_asset=$manifestAsset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest_url=$manifestUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify Windows Source Version
        shell: pwsh
        env:
          WORKFLOW_APP_VERSION: ${{ steps.release.outputs.app_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $pubspecPath = "Platform_Windows\pubspec.yaml"
          $versionLines = @(
            Get-Content -LiteralPath $pubspecPath |
              Where-Object { $_ -match '^version:\s*' }
          )
          if ($versionLines.Count -ne 1) {
            throw "Expected exactly one top-level version entry in $pubspecPath."
          }

          $sourceVersion = ($versionLines[0] -replace '^version:\s*', '').Trim()
          $workflowVersion = [string]$env:WORKFLOW_APP_VERSION
          if ($sourceVersion -ne $workflowVersion) {
            throw "Windows release version mismatch: pubspec has '$sourceVersion', workflow requested '$workflowVersion'."
          }
          Write-Host "Verified Windows release version $workflowVersion."

      - name: Preflight Required Release Credentials
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.release_channel }}
          FALLBACK_MANIFEST_URL: ${{ steps.release.outputs.manifest_url }}
          FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
          AUTOTELEPROMPTER_ADMIN_EMAIL: ${{ secrets.AUTOTELEPROMPTER_ADMIN_EMAIL }}
          AUTOTELEPROMPTER_ADMIN_CODE_SHA256: ${{ secrets.AUTOTELEPROMPTER_ADMIN_CODE_SHA256 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          UPDATE_MANIFEST_URL_VAR: ${{ vars.UPDATE_MANIFEST_URL }}
          PUBLIC_RELEASES_TOKEN: ${{ secrets.AUTOTELEPROMPTER_RELEASES_TOKEN }}
          INTERNAL_RELEASES_TOKEN: ${{ secrets.AUTOTELEPROMPTER_INTERNAL_RELEASES_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          function Require-Value([string] $name, [string] $value) {
            if ([string]::IsNullOrWhiteSpace(($value -replace "`r", "" -replace "`n", "").Trim())) {
              throw "Required release credential '$name' is missing. Published Windows builds must include feedback, cloud, admin, update, and Git release support."
            }
          }

          Require-Value "FEEDBACK_ENDPOINT" $env:FEEDBACK_ENDPOINT
          Require-Value "GOOGLE_DRIVE_CLIENT_ID" $env:GOOGLE_DRIVE_CLIENT_ID
          Require-Value "GOOGLE_DRIVE_CLIENT_SECRET" $env:GOOGLE_DRIVE_CLIENT_SECRET
          Require-Value "DROPBOX_CLIENT_ID" $env:DROPBOX_CLIENT_ID
          Require-Value "DROPBOX_CLIENT_SECRET" $env:DROPBOX_CLIENT_SECRET
          Require-Value "AUTOTELEPROMPTER_ADMIN_EMAIL" $env:AUTOTELEPROMPTER_ADMIN_EMAIL
          Require-Value "AUTOTELEPROMPTER_ADMIN_CODE_SHA256" $env:AUTOTELEPROMPTER_ADMIN_CODE_SHA256
          Require-Value "SUPABASE_URL" $env:SUPABASE_URL
          Require-Value "SUPABASE_ANON_KEY" $env:SUPABASE_ANON_KEY

          $supabaseUrl = ($env:SUPABASE_URL -replace "`r", "" -replace "`n", "").Trim()
          if ($supabaseUrl -notmatch '^https://[A-Za-z0-9.-]+\.supabase\.co/?$') {
            throw "SUPABASE_URL must be the HTTPS Supabase project URL."
          }

          $manifestUrl = ($env:UPDATE_MANIFEST_URL_VAR -replace "`r", "" -replace "`n", "").Trim()
          if ([string]::IsNullOrWhiteSpace($manifestUrl)) {
            $manifestUrl = [string]$env:FALLBACK_MANIFEST_URL
          }
          if ($manifestUrl -notmatch '^https://') {
            throw "UPDATE_MANIFEST_URL must resolve to an HTTPS URL."
          }

          $googleDriveClientId = ($env:GOOGLE_DRIVE_CLIENT_ID -replace "\s", "").Trim()
          if ($googleDriveClientId -notmatch '^\d+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$') {
            throw "GOOGLE_DRIVE_CLIENT_ID is malformed. Use the OAuth Desktop app Client ID ending in .apps.googleusercontent.com."
          }

          $adminCodeHash = ($env:AUTOTELEPROMPTER_ADMIN_CODE_SHA256 -replace "\s", "").Trim().ToLowerInvariant()
          if ($adminCodeHash -notmatch '^[a-f0-9]{64}$') {
            throw "AUTOTELEPROMPTER_ADMIN_CODE_SHA256 must be a lowercase SHA-256 hash."
          }

          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            if ($env:RELEASE_CHANNEL -eq "internal") {
              Require-Value "AUTOTELEPROMPTER_INTERNAL_RELEASES_TOKEN" $env:INTERNAL_RELEASES_TOKEN
            } else {
              Require-Value "AUTOTELEPROMPTER_RELEASES_TOKEN" $env:PUBLIC_RELEASES_TOKEN
            }
          }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Sync Dependencies
        run: flutter pub get
        working-directory: Platform_Windows

      - name: Verify Dependency Lockfile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git diff --exit-code -- Platform_Windows/pubspec.lock
          if ($LASTEXITCODE -ne 0) {
            throw "flutter pub get changed Platform_Windows/pubspec.lock. Commit the intended lockfile before releasing."
          }

      - name: Analyze Windows Source
        run: flutter analyze --no-pub
        working-directory: Platform_Windows

      - name: Test Windows Release Regressions
        shell: pwsh
        working-directory: Platform_Windows
        run: |
          $ErrorActionPreference = "Stop"
          $sttRegressionTests = @(
            "test/auth/account_session_refresh_test.dart"
            "test/platform/docx_import_styles_test.dart"
            "test/platform/markup_controller_live_selection_test.dart"
            "test/platform/rtf_import_formatting_test.dart"
            "test/platform/stt/stt_browser_adapter_security_test.dart"
            "test/platform/stt/stt_browser_page_runtime_test.dart"
            "test/platform/stt/stt_browser_lifecycle_test.dart"
            "test/platform/stt/stt_browser_stream_identity_test.dart"
            "test/platform/stt/stt_browser_recovery_tracking_test.dart"
            "test/platform/stt/stt_browser_locale_fence_test.dart"
            "test/platform/stt/stt_external_edge_launcher_test.dart"
            "test/platform/stt/stt_host_event_journal_test.dart"
            "test/platform/stt/stt_host_policy_test.dart"
            "test/platform/stt/stt_host_readiness_test.dart"
            "test/platform/stt/stt_host_transition_guard_test.dart"
            "test/platform/stt/stt_microphone_intent_test.dart"
            "test/platform/stt/stt_webview2_compatibility_test.dart"
            "test/platform/webview2/webview2_runtime_bootstrap_test.dart"
            "test/settings/app_settings_stt_engine_test.dart"
            "test/settings/cloud_account_connection_actions_test.dart"
            "test/settings/cloud_connection_refresh_test.dart"
            "test/settings/cloud_sign_in_test.dart"
            "test/settings/connection_maintenance_test.dart"
            "test/settings/editor_hotkeys_test.dart"
            "test/settings/hotkey_provider_test.dart"
            "test/settings/hotkey_settings_page_test.dart"
            "test/settings/settings_provider_stt_engine_test.dart"
            "test/settings/speech_scroll_settings_test.dart"
            "test/settings/stage3_4_theme_security_updater_test.dart"
            "test/settings/windows_stt_engine_selector_test.dart"
            "test/script/script_library_import_test.dart"
            "test/script/script_folder_import_test.dart"
            "test/script/script_workflow_widgets_test.dart"
            "test/script/script_library_parser_test.dart"
            "test/script/script_gallery_reopen_safety_test.dart"
            "test/teleprompter/debug_log_formatter_health_test.dart"
            "test/teleprompter/hidden_stt_webview_lifecycle_contract_test.dart"
            "test/teleprompter/number_mismatch_safety_recovery_test.dart"
            "test/teleprompter/presenter_highlight_style_test.dart"
            "test/teleprompter/presenter_hotkeys_test.dart"
            "test/teleprompter/presenter_reading_position_service_test.dart"
            "test/teleprompter/presenter_scroll_motion_test.dart"
            "test/teleprompter/presenter_viewport_test.dart"
            "test/teleprompter/presenter_horizontal_margins_test.dart"
            "test/teleprompter/speech_scroll_controls_test.dart"
            "test/teleprompter/spoken_number_normalizer_test.dart"
            "test/teleprompter/stt_recognition_policy_heartbeat_test.dart"
            "test/teleprompter/stt_transcript_buffer_service_test.dart"
            "test/teleprompter/stt_log_replay_test.dart"
            "test/teleprompter/stt_manual_jump_recovery_test.dart"
            "test/teleprompter/stt_manual_scroll_transaction_test.dart"
            "test/teleprompter/stt_scroll_handoff_test.dart"
            "test/teleprompter/stage1a_scroll_font_spacing_test.dart"
            "test/teleprompter/stage1b_core_parsers_editor_test.dart"
            "test/teleprompter/stage1c_stt_visible_skip_bridge_test.dart"
            "test/teleprompter/stt_recovery_locale_anchor_test.dart"
            "test/teleprompter/stt_inflight_progress_test.dart"
            "test/teleprompter/stt_browser_segment_boundary_test.dart"
            "test/teleprompter/stt_accepted_revision_test.dart"
            "test/teleprompter/stt_network_recovery_test.dart"
            "test/teleprompter/stt_rejected_partial_test.dart"
            "test/teleprompter/speech_connection_notice_test.dart"
            "test/teleprompter/stt_result_flow_diagnostics_test.dart"
            "test/teleprompter/teleprompter_external_edge_host_test.dart"
            "test/teleprompter/teleprompter_visible_skip_recovery_test.dart"
            "test/teleprompter/word_aligner_number_matching_test.dart"
          )
          & flutter test --no-pub --concurrency=1 @sttRegressionTests
          if ($LASTEXITCODE -ne 0) {
            throw "Windows release regression tests failed."
          }
          & ".\tool\windows\assert_v5_release_stt_artifacts_test.ps1"

      - name: Build Windows Archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseChannel = [string]$env:RELEASE_CHANNEL
          $appVersion = [string]$env:RELEASE_APP_VERSION
          Write-Host "Building Windows $appVersion artifact for update channel: $releaseChannel"
          $symbols = Join-Path $env:RUNNER_TEMP ("autoteleprompter-symbols\" + [string]$env:RELEASE_TAG)
          New-Item -ItemType Directory -Force -Path $symbols | Out-Null

          $endpoint = ($env:FEEDBACK_ENDPOINT -replace "`r", "" -replace "`n", "").Trim()
          $googleDriveClientId = ($env:GOOGLE_DRIVE_CLIENT_ID -replace "\s", "").Trim()
          $googleDriveClientSecret = ($env:GOOGLE_DRIVE_CLIENT_SECRET -replace "\s", "").Trim()
          $dropboxClientId = ($env:DROPBOX_CLIENT_ID -replace "\s", "").Trim()
          $dropboxClientSecret = ($env:DROPBOX_CLIENT_SECRET -replace "\s", "").Trim()
          $dropboxSyncRootPath = ($env:DROPBOX_SYNC_ROOT_PATH_VAR -replace "`r", "" -replace "`n", "").Trim()
          $adminEmail = ($env:AUTOTELEPROMPTER_ADMIN_EMAIL -replace "`r", "" -replace "`n", "").Trim()
          $adminCodeHash = ($env:AUTOTELEPROMPTER_ADMIN_CODE_SHA256 -replace "\s", "").Trim().ToLowerInvariant()
          $supabaseUrl = ($env:SUPABASE_URL -replace "`r", "" -replace "`n", "").Trim()
          $supabaseAnonKey = ($env:SUPABASE_ANON_KEY -replace "`r", "" -replace "`n", "").Trim()
          $graceKeyId = ($env:GRACE_TOKEN_KEY_ID_VAR -replace "`r", "" -replace "`n", "").Trim()
          $graceModulusHex = ($env:GRACE_TOKEN_PUBLIC_MODULUS_HEX_VAR -replace "\s", "").Trim().ToLowerInvariant()
          $graceExponentHex = ($env:GRACE_TOKEN_PUBLIC_EXPONENT_HEX_VAR -replace "\s", "").Trim().ToLowerInvariant()
          $accountBackendEnabled = if (-not [string]::IsNullOrWhiteSpace($supabaseUrl) -and
              -not [string]::IsNullOrWhiteSpace($supabaseAnonKey)) { "true" } else { "false" }
          $supabaseUrlForBuild = if ($accountBackendEnabled -eq "true") { $supabaseUrl } else { "" }
          $supabaseAnonKeyForBuild = if ($accountBackendEnabled -eq "true") { $supabaseAnonKey } else { "" }
          $adminEmailForBuild = if ($accountBackendEnabled -eq "true") { "" } else { $adminEmail }
          $adminCodeHashForBuild = if ($accountBackendEnabled -eq "true") { "" } else { $adminCodeHash }
          $feedbackEndpointForBuild = if ($accountBackendEnabled -eq "true") { "" } else { $endpoint }
          $updateManifestUrl = ($env:UPDATE_MANIFEST_URL_VAR -replace "`r", "" -replace "`n", "").Trim()
          if ([string]::IsNullOrWhiteSpace($updateManifestUrl)) {
            $updateManifestUrl = [string]$env:FALLBACK_MANIFEST_URL
          }

          if (-not [string]::IsNullOrWhiteSpace($googleDriveClientId) -and
              $googleDriveClientId -notmatch '^\d+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$') {
            throw "GOOGLE_DRIVE_CLIENT_ID is malformed. Use the OAuth Desktop app Client ID ending in .apps.googleusercontent.com."
          }
          if (-not [string]::IsNullOrWhiteSpace($adminCodeHash) -and
              $adminCodeHash -notmatch '^[a-f0-9]{64}$') {
            throw "AUTOTELEPROMPTER_ADMIN_CODE_SHA256 must be a lowercase SHA-256 hash."
          }

          $buildArgs = @(
            "build", "windows", "--release", "--obfuscate", "--split-debug-info=$symbols",
            "--dart-define=APP_VERSION=$appVersion",
            "--dart-define=FEEDBACK_ENDPOINT=$feedbackEndpointForBuild",
            "--dart-define=GOOGLE_DRIVE_CLIENT_ID=$googleDriveClientId",
            "--dart-define=GOOGLE_DRIVE_CLIENT_SECRET=$googleDriveClientSecret",
            "--dart-define=DROPBOX_CLIENT_ID=$dropboxClientId",
            "--dart-define=DROPBOX_CLIENT_SECRET=$dropboxClientSecret",
            "--dart-define=DROPBOX_SYNC_ROOT_PATH=$dropboxSyncRootPath",
            "--dart-define=AUTOTELEPROMPTER_ADMIN_EMAIL=$adminEmailForBuild",
            "--dart-define=AUTOTELEPROMPTER_ADMIN_CODE_SHA256=$adminCodeHashForBuild",
            "--dart-define=ACCOUNT_BACKEND_ENABLED=$accountBackendEnabled",
            "--dart-define=SUPABASE_URL=$supabaseUrlForBuild",
            "--dart-define=SUPABASE_ANON_KEY=$supabaseAnonKeyForBuild",
            "--dart-define=UPDATE_MANIFEST_URL=$updateManifestUrl"
          )
          if (-not [string]::IsNullOrWhiteSpace($graceKeyId) -and -not [string]::IsNullOrWhiteSpace($graceModulusHex)) {
            $buildArgs += "--dart-define=GRACE_TOKEN_KEY_ID=$graceKeyId"
            $buildArgs += "--dart-define=GRACE_TOKEN_PUBLIC_MODULUS_HEX=$graceModulusHex"
            if (-not [string]::IsNullOrWhiteSpace($graceExponentHex)) {
              $buildArgs += "--dart-define=GRACE_TOKEN_PUBLIC_EXPONENT_HEX=$graceExponentHex"
            }
          }
          & flutter @buildArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Windows release build failed."
          }
        working-directory: Platform_Windows
        env:
          RELEASE_CHANNEL: ${{ steps.release.outputs.release_channel }}
          RELEASE_APP_VERSION: ${{ steps.release.outputs.app_version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FALLBACK_MANIFEST_URL: ${{ steps.release.outputs.manifest_url }}
          FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
          DROPBOX_SYNC_ROOT_PATH_VAR: ${{ vars.DROPBOX_SYNC_ROOT_PATH }}
          AUTOTELEPROMPTER_ADMIN_EMAIL: ${{ secrets.AUTOTELEPROMPTER_ADMIN_EMAIL }}
          AUTOTELEPROMPTER_ADMIN_CODE_SHA256: ${{ secrets.AUTOTELEPROMPTER_ADMIN_CODE_SHA256 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          UPDATE_MANIFEST_URL_VAR: ${{ vars.UPDATE_MANIFEST_URL }}
          GRACE_TOKEN_KEY_ID_VAR: ${{ vars.GRACE_TOKEN_KEY_ID }}
          GRACE_TOKEN_PUBLIC_MODULUS_HEX_VAR: ${{ vars.GRACE_TOKEN_PUBLIC_MODULUS_HEX }}
          GRACE_TOKEN_PUBLIC_EXPONENT_HEX_VAR: ${{ vars.GRACE_TOKEN_PUBLIC_EXPONENT_HEX }}

      - name: Verify Release Binary Contains No Secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $appSo = "Platform_Windows\build\windows\x64\runner\Release\data\app.so"
          if (-not (Test-Path -LiteralPath $appSo -PathType Leaf)) {
            throw "Expected Flutter release AOT snapshot at $appSo."
          }
          $text = [System.Text.Encoding]::Latin1.GetString([System.IO.File]::ReadAllBytes($appSo))
          $forbidden = @("service_role", "script.google.com", "GRACE_TOKEN_PRIVATE_JWK")
          foreach ($needle in $forbidden) {
            if ($text.Contains($needle)) {
              throw "Forbidden secret/backend marker '$needle' detected in compiled release binary $appSo."
            }
          }
          Write-Host "Release binary secret scan passed."

      - name: Bundle Fixed WebView2 Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ".\Platform_Windows\tool\windows\package_fixed_webview2_runtime.ps1" `
            -DestinationRoot ".\Platform_Windows\build\windows\x64\runner\Release" `
            -CabPath (Join-Path $env:RUNNER_TEMP "Microsoft.WebView2.FixedVersionRuntime.152.0.4191.62.x64.cab")

      - name: Verify Browser-Only V5 STT Artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & ".\Platform_Windows\tool\windows\assert_v5_release_stt_artifacts.ps1" `
            -ReleaseRoot ".\Platform_Windows\build\windows\x64\runner\Release"

      - name: Verify Windows Binary Version
        shell: pwsh
        env:
          EXPECTED_APP_VERSION: ${{ steps.release.outputs.app_version }}
        run: |
          $ErrorActionPreference = "Stop"
          $expectedVersion = [string]$env:EXPECTED_APP_VERSION
          $binaryPath = "Platform_Windows\build\windows\x64\runner\Release\autoteleprompter.exe"
          if (-not (Test-Path -LiteralPath $binaryPath -PathType Leaf)) {
            throw "Windows release binary was not produced at $binaryPath."
          }

          $versionInfo = (Get-Item -LiteralPath $binaryPath).VersionInfo
          $fileVersion = ([string] $versionInfo.FileVersion).Trim()
          $productVersion = ([string] $versionInfo.ProductVersion).Trim()
          if ($fileVersion -ne $expectedVersion -or $productVersion -ne $expectedVersion) {
            throw "Windows binary version mismatch: expected '$expectedVersion', FileVersion='$fileVersion', ProductVersion='$productVersion'."
          }
          Write-Host "Verified Windows binary FileVersion and ProductVersion as $expectedVersion."

      - name: Package Artifacts
        id: package
        shell: pwsh
        env:
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build-zip | Out-Null
          $releaseDir = "Platform_Windows\build\windows\x64\runner\Release"
          $runtimeDebugDir = Join-Path $releaseDir "debug"
          if (Test-Path $runtimeDebugDir) {
            Remove-Item -LiteralPath $runtimeDebugDir -Recurse -Force
          }
          $packageDir = "build-zip\AutoTeleprompter-Windows"
          if (Test-Path $packageDir) {
            Remove-Item -LiteralPath $packageDir -Recurse -Force
          }
          xcopy /E /I $releaseDir $packageDir
          $zipPath = Join-Path "build-zip" ([string]$env:ASSET_NAME)
          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -Force
          $zipSha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "zip_sha256=$zipSha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.asset_name }}
          path: build-zip\AutoTeleprompter-Windows

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_REPO: ${{ steps.release.outputs.release_repo }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.release_channel }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_LABEL: ${{ steps.release.outputs.release_label }}
          RELEASE_APP_VERSION: ${{ steps.release.outputs.app_version }}
          RELEASE_PRE_RELEASE: ${{ steps.release.outputs.pre_release }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          PUBLIC_RELEASES_TOKEN: ${{ secrets.AUTOTELEPROMPTER_RELEASES_TOKEN }}
          INTERNAL_RELEASES_TOKEN: ${{ secrets.AUTOTELEPROMPTER_INTERNAL_RELEASES_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = [string]$env:RELEASE_REPO
          $channel = [string]$env:RELEASE_CHANNEL
          $tag = [string]$env:RELEASE_TAG
          $title = [string]$env:RELEASE_TITLE
          $label = [string]$env:RELEASE_LABEL
          $appVersion = [string]$env:RELEASE_APP_VERSION
          $zipPath = [string]$env:ZIP_PATH
          $token = if ($channel -eq "internal") { $env:INTERNAL_RELEASES_TOKEN } else { $env:PUBLIC_RELEASES_TOKEN }
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "Release token is missing for $channel. Set AUTOTELEPROMPTER_RELEASES_TOKEN or AUTOTELEPROMPTER_INTERNAL_RELEASES_TOKEN."
          }
          $env:GH_TOKEN = $token

          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @"
          $title

          Channel: $channel
          Label: $label
          Version: $appVersion

          This package was produced by the Windows release workflow.
          "@ | Set-Content -LiteralPath $notesFile -Encoding UTF8

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @(
              "release", "create", $tag, $zipPath,
              "--repo", $repo,
              "--title", $title,
              "--notes-file", $notesFile
            )
            if ([string]$env:RELEASE_PRE_RELEASE -eq "true") {
              $createArgs += "--prerelease"
            }
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub release $tag in $repo." }
          } else {
            gh release upload $tag $zipPath --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload release asset to $tag in $repo." }
          }

      - name: Update Release Manifest
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_REPO: ${{ steps.release.outputs.release_repo }}
          RELEASE_CHANNEL: ${{ steps.release.outputs.release_channel }}
          RELEASE_APP_VERSION: ${{ steps.release.outputs.app_version }}
          RELEASE_LABEL: ${{ steps.release.outputs.release_label }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ASSET_NAME: ${{ steps.release.outputs.asset_name }}
          MANIFEST_TAG: ${{ steps.release.outputs.manifest_tag }}
          MANIFEST_ASSET: ${{ steps.release.outputs.manifest_asset }}
          ZIP_SHA256: ${{ steps.package.outputs.zip_sha256 }}
          PUBLIC_RELEASES_TOKEN: ${{ secrets.AUTOTELEPROMPTER_RELEASES_TOKEN }}
          INTERNAL_RELEASES_TOKEN: ${{ secrets.AUTOTELEPROMPTER_INTERNAL_RELEASES_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = [string]$env:RELEASE_REPO
          $channel = [string]$env:RELEASE_CHANNEL
          $token = if ($channel -eq "internal") { $env:INTERNAL_RELEASES_TOKEN } else { $env:PUBLIC_RELEASES_TOKEN }
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "Release token is missing for manifest update."
          }
          $env:GH_TOKEN = $token

          $manifestTag = [string]$env:MANIFEST_TAG
          $manifestAsset = [string]$env:MANIFEST_ASSET
          $manifestDir = Join-Path $env:RUNNER_TEMP "manifest"
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
          $manifestPath = Join-Path $manifestDir $manifestAsset

          $existingChannels = @{}
          gh release download $manifestTag --repo $repo --pattern $manifestAsset --dir $manifestDir --clobber *> $null
          if ($LASTEXITCODE -eq 0 -and (Test-Path $manifestPath)) {
            try {
              $existing = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
              if ($existing.channels) {
                foreach ($property in $existing.channels.PSObject.Properties) {
                  $existingChannels[$property.Name] = $property.Value
                }
              }
            } catch {
              Write-Warning "Existing manifest could not be parsed; replacing it."
              $existingChannels = @{}
            }
          }

          $releaseTag = [string]$env:RELEASE_TAG
          $assetName = [string]$env:ASSET_NAME
          $downloadUrl = "https://github.com/$repo/releases/download/$releaseTag/$assetName"
          $existingChannels[$channel] = [ordered]@{
            version = [string]$env:RELEASE_APP_VERSION
            url = $downloadUrl
            sha256 = [string]$env:ZIP_SHA256
            notes = [string]$env:RELEASE_LABEL
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            tag = $releaseTag
            asset = $assetName
          }
          $manifest = [ordered]@{
            kind = "autoteleprompter.windows.update_manifest"
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
            channels = [ordered]@{}
          }
          foreach ($name in @("stable", "beta", "internal")) {
            if ($existingChannels.ContainsKey($name)) {
              $manifest.channels[$name] = $existingChannels[$name]
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $manifestPath -Encoding UTF8

          $notesFile = Join-Path $env:RUNNER_TEMP "manifest-notes.md"
          "Machine-readable Windows update manifest for AutoTeleprompter." |
            Set-Content -LiteralPath $notesFile -Encoding UTF8

          gh release view $manifestTag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $manifestTag $manifestPath --repo $repo --title "AutoTeleprompter Windows Update Manifest" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "Failed to create manifest release in $repo." }
          } else {
            gh release upload $manifestTag $manifestPath --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload manifest to $repo." }
          }
