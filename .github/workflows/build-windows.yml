name: Build Windows EXE (v5.1.2)
run-name: Windows ${{ github.event.inputs.app_version || '5.1.2+59' }} ${{ github.event.inputs.release_channel || 'stable' }} EXE

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel for this Windows package'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - internal
      app_version:
        description: 'Flutter app version, for example 5.1.2+59'
        required: true
        default: '5.1.2+59'
        type: string
      release_label:
        description: 'Human label such as Beta 1 or Stable'
        required: false
        default: 'Stable'
        type: string
      release_number:
        description: 'Beta/internal sequence number'
        required: false
        default: '1'
        type: string

jobs:
  build:
    name: Build AutoTeleprompter for Windows
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Resolve Release Metadata
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseChannel = "${{ github.event.inputs.release_channel }}"
          if ([string]::IsNullOrWhiteSpace($releaseChannel)) {
            $releaseChannel = "stable"
          }
          $releaseChannel = $releaseChannel.Trim().ToLowerInvariant()
          if (@("stable", "beta", "internal") -notcontains $releaseChannel) {
            throw "Unsupported release_channel '$releaseChannel'."
          }

          $appVersion = "${{ github.event.inputs.app_version }}"
          if ([string]::IsNullOrWhiteSpace($appVersion)) {
            $appVersion = "5.1.2+59"
          }
          $appVersion = $appVersion.Trim()
          if ($appVersion -notmatch '^\d+\.\d+\.\d+\+\d+$') {
            throw "app_version must look like 5.1.2+59."
          }
          $versionName = ($appVersion -split '\+', 2)[0]

          $releaseNumber = "${{ github.event.inputs.release_number }}"
          if ([string]::IsNullOrWhiteSpace($releaseNumber)) {
            $releaseNumber = "1"
          }
          $releaseNumber = $releaseNumber.Trim()
          if ($releaseNumber -notmatch '^\d+$') {
            throw "release_number must be a positive integer."
          }

          $releaseLabel = "${{ github.event.inputs.release_label }}"
          if ([string]::IsNullOrWhiteSpace($releaseLabel)) {
            if ($releaseChannel -eq "stable") {
              $releaseLabel = "Stable"
            } elseif ($releaseChannel -eq "internal") {
              $releaseLabel = "Internal $releaseNumber"
            } else {
              $releaseLabel = "Beta $releaseNumber"
            }
          }
          $releaseLabel = $releaseLabel.Trim()

          if ($releaseChannel -eq "stable") {
            $tag = "windows-v$versionName"
            $title = "AutoTeleprompter Windows v$versionName"
            $preRelease = "false"
          } elseif ($releaseChannel -eq "internal") {
            $tag = "windows-v$versionName-internal.$releaseNumber"
            $title = "AutoTeleprompter Windows v$versionName Internal $releaseNumber"
            $preRelease = "true"
          } else {
            $tag = "windows-v$versionName-beta.$releaseNumber"
            $title = "AutoTeleprompter Windows v$versionName Beta $releaseNumber"
            $preRelease = "true"
          }

          $publicRepo = "abprogroup/AutoTeleprompter-Releases"
          $internalRepo = "abprogroup/AutoTeleprompter-Internal-Releases"
          $releaseRepo = if ($releaseChannel -eq "internal") { $internalRepo } else { $publicRepo }
          $assetName = "AutoTeleprompter-Windows-$tag.zip"
          $manifestTag = "windows-update-manifest"
          $manifestAsset = "windows-update-manifest.json"
          $manifestUrl = "https://github.com/$releaseRepo/releases/download/$manifestTag/$manifestAsset"

          "release_channel=$releaseChannel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "app_version=$appVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version_name=$versionName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_number=$releaseNumber" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_label=$releaseLabel" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "pre_release=$preRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_repo=$releaseRepo" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest_tag=$manifestTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest_asset=$manifestAsset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest_url=$manifestUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Preflight Required Release Credentials
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
          AUTOTELEPROMPTER_ADMIN_EMAIL: ${{ secrets.AUTOTELEPROMPTER_ADMIN_EMAIL }}
          AUTOTELEPROMPTER_ADMIN_CODE_SHA256: ${{ secrets.AUTOTELEPROMPTER_ADMIN_CODE_SHA256 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          UPDATE_MANIFEST_URL_SECRET: ${{ secrets.UPDATE_MANIFEST_URL }}
          UPDATE_MANIFEST_URL_VAR: ${{ vars.UPDATE_MANIFEST_URL }}
          PUBLIC_RELEASES_TOKEN: ${{ secrets.AUTOTELEPROMPTER_RELEASES_TOKEN }}
          INTERNAL_RELEASES_TOKEN: ${{ secrets.AUTOTELEPROMPTER_INTERNAL_RELEASES_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          function Require-Value([string] $name, [string] $value) {
            if ([string]::IsNullOrWhiteSpace(($value -replace "`r", "" -replace "`n", "").Trim())) {
              throw "Required release credential '$name' is missing. Published Windows builds must include feedback, cloud, admin, update, and Git release support."
            }
          }

          Require-Value "FEEDBACK_ENDPOINT" $env:FEEDBACK_ENDPOINT
          Require-Value "GOOGLE_DRIVE_CLIENT_ID" $env:GOOGLE_DRIVE_CLIENT_ID
          Require-Value "GOOGLE_DRIVE_CLIENT_SECRET" $env:GOOGLE_DRIVE_CLIENT_SECRET
          Require-Value "DROPBOX_CLIENT_ID" $env:DROPBOX_CLIENT_ID
          Require-Value "DROPBOX_CLIENT_SECRET" $env:DROPBOX_CLIENT_SECRET
          Require-Value "AUTOTELEPROMPTER_ADMIN_EMAIL" $env:AUTOTELEPROMPTER_ADMIN_EMAIL
          Require-Value "AUTOTELEPROMPTER_ADMIN_CODE_SHA256" $env:AUTOTELEPROMPTER_ADMIN_CODE_SHA256
          Require-Value "SUPABASE_URL" $env:SUPABASE_URL
          Require-Value "SUPABASE_ANON_KEY" $env:SUPABASE_ANON_KEY

          $supabaseUrl = ($env:SUPABASE_URL -replace "`r", "" -replace "`n", "").Trim()
          if ($supabaseUrl -notmatch '^https://[A-Za-z0-9.-]+\.supabase\.co/?$') {
            throw "SUPABASE_URL must be the HTTPS Supabase project URL."
          }

          $manifestUrl = ($env:UPDATE_MANIFEST_URL_SECRET -replace "`r", "" -replace "`n", "").Trim()
          if ([string]::IsNullOrWhiteSpace($manifestUrl)) {
            $manifestUrl = ($env:UPDATE_MANIFEST_URL_VAR -replace "`r", "" -replace "`n", "").Trim()
          }
          if ([string]::IsNullOrWhiteSpace($manifestUrl)) {
            $manifestUrl = "${{ steps.release.outputs.manifest_url }}"
          }
          if ($manifestUrl -notmatch '^https://') {
            throw "UPDATE_MANIFEST_URL must resolve to an HTTPS URL."
          }

          $googleDriveClientId = ($env:GOOGLE_DRIVE_CLIENT_ID -replace "\s", "").Trim()
          if ($googleDriveClientId -notmatch '^\d+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$') {
            throw "GOOGLE_DRIVE_CLIENT_ID is malformed. Use the OAuth Desktop app Client ID ending in .apps.googleusercontent.com."
          }

          $adminCodeHash = ($env:AUTOTELEPROMPTER_ADMIN_CODE_SHA256 -replace "\s", "").Trim().ToLowerInvariant()
          if ($adminCodeHash -notmatch '^[a-f0-9]{64}$') {
            throw "AUTOTELEPROMPTER_ADMIN_CODE_SHA256 must be a lowercase SHA-256 hash."
          }

          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            if ("${{ steps.release.outputs.release_channel }}" -eq "internal") {
              Require-Value "AUTOTELEPROMPTER_INTERNAL_RELEASES_TOKEN" $env:INTERNAL_RELEASES_TOKEN
            } else {
              Require-Value "AUTOTELEPROMPTER_RELEASES_TOKEN" $env:PUBLIC_RELEASES_TOKEN
            }
          }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Sync Dependencies
        run: flutter pub get
        working-directory: Platform_Windows

      - name: Build Windows Archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseChannel = "${{ steps.release.outputs.release_channel }}"
          $appVersion = "${{ steps.release.outputs.app_version }}"
          Write-Host "Building Windows $appVersion artifact for update channel: $releaseChannel"
          $symbols = Join-Path $env:RUNNER_TEMP "autoteleprompter-symbols\${{ steps.release.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path $symbols | Out-Null

          $endpoint = ($env:FEEDBACK_ENDPOINT -replace "`r", "" -replace "`n", "").Trim()
          $googleDriveClientId = ($env:GOOGLE_DRIVE_CLIENT_ID -replace "\s", "").Trim()
          $googleDriveClientSecret = ($env:GOOGLE_DRIVE_CLIENT_SECRET -replace "\s", "").Trim()
          $dropboxClientId = ($env:DROPBOX_CLIENT_ID -replace "\s", "").Trim()
          $dropboxClientSecret = ($env:DROPBOX_CLIENT_SECRET -replace "\s", "").Trim()
          $dropboxSyncRootPath = ($env:DROPBOX_SYNC_ROOT_PATH_SECRET -replace "`r", "" -replace "`n", "").Trim()
          if ([string]::IsNullOrWhiteSpace($dropboxSyncRootPath)) {
            $dropboxSyncRootPath = ($env:DROPBOX_SYNC_ROOT_PATH_VAR -replace "`r", "" -replace "`n", "").Trim()
          }
          $adminEmail = ($env:AUTOTELEPROMPTER_ADMIN_EMAIL -replace "`r", "" -replace "`n", "").Trim()
          $adminCodeHash = ($env:AUTOTELEPROMPTER_ADMIN_CODE_SHA256 -replace "\s", "").Trim().ToLowerInvariant()
          $supabaseUrl = ($env:SUPABASE_URL -replace "`r", "" -replace "`n", "").Trim()
          $supabaseAnonKey = ($env:SUPABASE_ANON_KEY -replace "`r", "" -replace "`n", "").Trim()
          $accountBackendEnabled = if (-not [string]::IsNullOrWhiteSpace($supabaseUrl) -and
              -not [string]::IsNullOrWhiteSpace($supabaseAnonKey)) { "true" } else { "false" }
          $supabaseUrlForBuild = if ($accountBackendEnabled -eq "true") { $supabaseUrl } else { "" }
          $supabaseAnonKeyForBuild = if ($accountBackendEnabled -eq "true") { $supabaseAnonKey } else { "" }
          $adminEmailForBuild = if ($accountBackendEnabled -eq "true") { "" } else { $adminEmail }
          $adminCodeHashForBuild = if ($accountBackendEnabled -eq "true") { "" } else { $adminCodeHash }
          $feedbackEndpointForBuild = if ($accountBackendEnabled -eq "true") { "" } else { $endpoint }
          $updateManifestUrl = ($env:UPDATE_MANIFEST_URL_SECRET -replace "`r", "" -replace "`n", "").Trim()
          if ([string]::IsNullOrWhiteSpace($updateManifestUrl)) {
            $updateManifestUrl = ($env:UPDATE_MANIFEST_URL_VAR -replace "`r", "" -replace "`n", "").Trim()
          }
          if ([string]::IsNullOrWhiteSpace($updateManifestUrl)) {
            $updateManifestUrl = "${{ steps.release.outputs.manifest_url }}"
          }

          if (-not [string]::IsNullOrWhiteSpace($googleDriveClientId) -and
              $googleDriveClientId -notmatch '^\d+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$') {
            throw "GOOGLE_DRIVE_CLIENT_ID is malformed. Use the OAuth Desktop app Client ID ending in .apps.googleusercontent.com."
          }
          if (-not [string]::IsNullOrWhiteSpace($adminCodeHash) -and
              $adminCodeHash -notmatch '^[a-f0-9]{64}$') {
            throw "AUTOTELEPROMPTER_ADMIN_CODE_SHA256 must be a lowercase SHA-256 hash."
          }

          flutter build windows --release --obfuscate --split-debug-info="$symbols" `
            --dart-define=APP_VERSION="$appVersion" `
            --dart-define=FEEDBACK_ENDPOINT="$feedbackEndpointForBuild" `
            --dart-define=GOOGLE_DRIVE_CLIENT_ID="$googleDriveClientId" `
            --dart-define=GOOGLE_DRIVE_CLIENT_SECRET="$googleDriveClientSecret" `
            --dart-define=DROPBOX_CLIENT_ID="$dropboxClientId" `
            --dart-define=DROPBOX_CLIENT_SECRET="$dropboxClientSecret" `
            --dart-define=DROPBOX_SYNC_ROOT_PATH="$dropboxSyncRootPath" `
            --dart-define=AUTOTELEPROMPTER_ADMIN_EMAIL="$adminEmailForBuild" `
            --dart-define=AUTOTELEPROMPTER_ADMIN_CODE_SHA256="$adminCodeHashForBuild" `
            --dart-define=ACCOUNT_BACKEND_ENABLED="$accountBackendEnabled" `
            --dart-define=SUPABASE_URL="$supabaseUrlForBuild" `
            --dart-define=SUPABASE_ANON_KEY="$supabaseAnonKeyForBuild" `
            --dart-define=UPDATE_MANIFEST_URL="$updateManifestUrl"
        working-directory: Platform_Windows
        env:
          FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
          DROPBOX_SYNC_ROOT_PATH_SECRET: ${{ secrets.DROPBOX_SYNC_ROOT_PATH }}
          DROPBOX_SYNC_ROOT_PATH_VAR: ${{ vars.DROPBOX_SYNC_ROOT_PATH }}
          AUTOTELEPROMPTER_ADMIN_EMAIL: ${{ secrets.AUTOTELEPROMPTER_ADMIN_EMAIL }}
          AUTOTELEPROMPTER_ADMIN_CODE_SHA256: ${{ secrets.AUTOTELEPROMPTER_ADMIN_CODE_SHA256 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          UPDATE_MANIFEST_URL_SECRET: ${{ secrets.UPDATE_MANIFEST_URL }}
          UPDATE_MANIFEST_URL_VAR: ${{ vars.UPDATE_MANIFEST_URL }}

      - name: Package Artifacts
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build-zip | Out-Null
          $releaseDir = "Platform_Windows\build\windows\x64\runner\Release"
          $runtimeDebugDir = Join-Path $releaseDir "debug"
          if (Test-Path $runtimeDebugDir) {
            Remove-Item -LiteralPath $runtimeDebugDir -Recurse -Force
          }
          $packageDir = "build-zip\AutoTeleprompter-Windows"
          if (Test-Path $packageDir) {
            Remove-Item -LiteralPath $packageDir -Recurse -Force
          }
          xcopy /E /I $releaseDir $packageDir
          $zipPath = "build-zip\${{ steps.release.outputs.asset_name }}"
          if (Test-Path $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -Force
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.asset_name }}
          path: build-zip\AutoTeleprompter-Windows

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          PUBLIC_RELEASES_TOKEN: ${{ secrets.AUTOTELEPROMPTER_RELEASES_TOKEN }}
          INTERNAL_RELEASES_TOKEN: ${{ secrets.AUTOTELEPROMPTER_INTERNAL_RELEASES_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "${{ steps.release.outputs.release_repo }}"
          $channel = "${{ steps.release.outputs.release_channel }}"
          $tag = "${{ steps.release.outputs.tag }}"
          $title = "${{ steps.release.outputs.title }}"
          $label = "${{ steps.release.outputs.release_label }}"
          $zipPath = "${{ steps.package.outputs.zip_path }}"
          $token = if ($channel -eq "internal") { $env:INTERNAL_RELEASES_TOKEN } else { $env:PUBLIC_RELEASES_TOKEN }
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "Release token is missing for $channel. Set AUTOTELEPROMPTER_RELEASES_TOKEN or AUTOTELEPROMPTER_INTERNAL_RELEASES_TOKEN."
          }
          $env:GH_TOKEN = $token

          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @"
          $title

          Channel: $channel
          Label: $label
          Version: ${{ steps.release.outputs.app_version }}

          This package was produced by the Windows release workflow.
          "@ | Set-Content -LiteralPath $notesFile -Encoding UTF8

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @(
              "release", "create", $tag, $zipPath,
              "--repo", $repo,
              "--title", $title,
              "--notes-file", $notesFile
            )
            if ("${{ steps.release.outputs.pre_release }}" -eq "true") {
              $createArgs += "--prerelease"
            }
            gh @createArgs
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub release $tag in $repo." }
          } else {
            gh release upload $tag $zipPath --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload release asset to $tag in $repo." }
          }

      - name: Update Release Manifest
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          PUBLIC_RELEASES_TOKEN: ${{ secrets.AUTOTELEPROMPTER_RELEASES_TOKEN }}
          INTERNAL_RELEASES_TOKEN: ${{ secrets.AUTOTELEPROMPTER_INTERNAL_RELEASES_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $repo = "${{ steps.release.outputs.release_repo }}"
          $channel = "${{ steps.release.outputs.release_channel }}"
          $token = if ($channel -eq "internal") { $env:INTERNAL_RELEASES_TOKEN } else { $env:PUBLIC_RELEASES_TOKEN }
          if ([string]::IsNullOrWhiteSpace($token)) {
            throw "Release token is missing for manifest update."
          }
          $env:GH_TOKEN = $token

          $manifestTag = "${{ steps.release.outputs.manifest_tag }}"
          $manifestAsset = "${{ steps.release.outputs.manifest_asset }}"
          $manifestDir = Join-Path $env:RUNNER_TEMP "manifest"
          New-Item -ItemType Directory -Force -Path $manifestDir | Out-Null
          $manifestPath = Join-Path $manifestDir $manifestAsset

          $existingChannels = @{}
          gh release download $manifestTag --repo $repo --pattern $manifestAsset --dir $manifestDir --clobber *> $null
          if ($LASTEXITCODE -eq 0 -and (Test-Path $manifestPath)) {
            try {
              $existing = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
              if ($existing.channels) {
                foreach ($property in $existing.channels.PSObject.Properties) {
                  $existingChannels[$property.Name] = $property.Value
                }
              }
            } catch {
              Write-Warning "Existing manifest could not be parsed; replacing it."
              $existingChannels = @{}
            }
          }

          $downloadUrl = "https://github.com/${{ steps.release.outputs.release_repo }}/releases/download/${{ steps.release.outputs.tag }}/${{ steps.release.outputs.asset_name }}"
          $existingChannels[$channel] = [ordered]@{
            version = "${{ steps.release.outputs.app_version }}"
            url = $downloadUrl
            notes = "${{ steps.release.outputs.release_label }}"
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            tag = "${{ steps.release.outputs.tag }}"
            asset = "${{ steps.release.outputs.asset_name }}"
          }
          $manifest = [ordered]@{
            kind = "autoteleprompter.windows.update_manifest"
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
            channels = [ordered]@{}
          }
          foreach ($name in @("stable", "beta", "internal")) {
            if ($existingChannels.ContainsKey($name)) {
              $manifest.channels[$name] = $existingChannels[$name]
            }
          }
          $manifest | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $manifestPath -Encoding UTF8

          $notesFile = Join-Path $env:RUNNER_TEMP "manifest-notes.md"
          "Machine-readable Windows update manifest for AutoTeleprompter." |
            Set-Content -LiteralPath $notesFile -Encoding UTF8

          gh release view $manifestTag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $manifestTag $manifestPath --repo $repo --title "AutoTeleprompter Windows Update Manifest" --notes-file $notesFile
            if ($LASTEXITCODE -ne 0) { throw "Failed to create manifest release in $repo." }
          } else {
            gh release upload $manifestTag $manifestPath --repo $repo --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload manifest to $repo." }
          }
