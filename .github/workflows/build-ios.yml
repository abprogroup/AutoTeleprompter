name: Build iOS IPA (v5.0.0)
run-name: iOS v5.0.0 IPA run ${{ github.run_number }} - ${{ github.event_name == 'workflow_dispatch' && 'manual dispatch' || github.event.head_commit.message }}

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java (Requirement for some plugins)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.8'
          cache: true

      - name: Check Environment (Flutter Doctor)
        run: flutter doctor
        working-directory: Platform_iOS

      - name: Clean Environment
        run: flutter clean
        working-directory: Platform_iOS

      - name: Install Dependencies
        run: flutter pub upgrade
        working-directory: Platform_iOS

      - name: Verify iOS v5.0.0 metadata
        run: |
          grep -Fxq 'version: 5.0.0+8' pubspec.yaml
        working-directory: Platform_iOS

      - name: Install Cocoapods (iOS only)
        run: |
          sudo gem install cocoapods
          pod --version
        
      - name: Build iOS (No Signing)
        # We add 'v' for verbose logging so we can see the exact error if it fails
        run: |
          endpoint="$(python3 ../.github/scripts/sanitize_feedback_endpoint.py "$FEEDBACK_ENDPOINT")"
          flutter build ios --release --no-codesign -v "--dart-define=APP_VERSION=5.0.0+8" "--dart-define=FEEDBACK_ENDPOINT=$endpoint"
        working-directory: Platform_iOS
        env:
          FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}

      - name: Zip .app to .ipa
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos/
          zip -r AutoTeleprompter-iOS-v5.0.0.ipa Payload
        working-directory: Platform_iOS

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: AutoTeleprompter-iOS-v5.0.0
          path: Platform_iOS/build/ios/iphoneos/AutoTeleprompter-iOS-v5.0.0.ipa
