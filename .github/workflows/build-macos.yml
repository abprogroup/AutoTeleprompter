name: Build macOS App
run-name: macOS ${{ github.event.inputs.app_version || '5.0.8+31' }} ${{ github.event.inputs.release_channel || 'stable' }} run ${{ github.run_number }} - manual dispatch


on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release channel for this macOS package'
        required: true
        type: choice
        default: stable
        options:
          - stable
          - beta
      app_version:
        description: 'Flutter app version, for example 5.0.8+31'
        required: true
        default: '5.0.8+31'
      release_number:
        description: 'Beta sequence number; leave blank for stable'
        required: false
        default: ''

jobs:
  build:
    name: Build AutoTeleprompter for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get
        working-directory: Platform_macOS

      - name: Verify macOS source metadata
        run: |
          grep -Fxq 'version: ${{ github.event.inputs.app_version }}' pubspec.yaml
        working-directory: Platform_macOS

      - name: Patch Podfile Deployment Target
        # flutter pub get generates macos/Podfile with the old platform version.
        # whisper_flutter_new requires macOS 10.15. Force it here before pod install runs.
        run: |
          sed -i '' "s/platform :osx, '[0-9.]*'/platform :osx, '11.0'/" Platform_macOS/macos/Podfile
          head -3 Platform_macOS/macos/Podfile

      - name: Prepare macOS Release Metadata
        id: release
        run: |
          set -euo pipefail
          releaseChannel="${{ github.event.inputs.release_channel }}"
          if [ -z "$releaseChannel" ]; then
            releaseChannel="stable"
          fi
          case "$releaseChannel" in
            stable|beta) ;;
            *) echo "Unsupported release_channel '$releaseChannel'." >&2; exit 1 ;;
          esac
          appVersion="${{ github.event.inputs.app_version }}"
          if [ -z "$appVersion" ]; then
            appVersion="5.0.8+31"
          fi
          if [[ ! "$appVersion" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "app_version must look like 5.0.8+31." >&2
            exit 1
          fi
          versionName="${appVersion%%+*}"
          buildNumber="${appVersion##*+}"
          releaseNumber="${{ github.event.inputs.release_number }}"
          releaseRepo="abprogroup/AutoTeleprompter-Releases"
          if [ "$releaseChannel" = "beta" ]; then
            if [ -z "$releaseNumber" ]; then
              releaseNumber="$buildNumber"
            fi
            tag="macos-v$versionName-beta.$releaseNumber"
            assetName="AutoTeleprompter-macOS-macos-v$versionName-beta.$releaseNumber.zip"
            releaseTitle="AutoTeleprompter macOS v$versionName Beta $releaseNumber"
          else
            tag="macos-v$versionName"
            assetName="AutoTeleprompter-macOS-macos-v$versionName.zip"
            releaseTitle="AutoTeleprompter macOS v$versionName"
          fi
          manifestTag="macos-update-manifest"
          manifestAsset="macos-update-manifest.json"
          manifestUrl="https://github.com/$releaseRepo/releases/download/$manifestTag/$manifestAsset"
          {
            echo "release_channel=$releaseChannel"
            echo "version_name=$versionName"
            echo "build_number=$buildNumber"
            echo "app_version=$appVersion"
            echo "release_repo=$releaseRepo"
            echo "tag=$tag"
            echo "asset_name=$assetName"
            echo "release_title=$releaseTitle"
            echo "manifest_tag=$manifestTag"
            echo "manifest_asset=$manifestAsset"
            echo "manifest_url=$manifestUrl"
          } >> "$GITHUB_OUTPUT"

      - name: Build macOS App
        run: |
          set -euo pipefail
          # --- Trim secrets (strip CR/LF/space) ---
          supabaseUrl="$(printf '%s' "${SUPABASE_URL:-}" | tr -d '\r\n' | xargs)"
          supabaseAnon="$(printf '%s' "${SUPABASE_ANON_KEY:-}" | tr -d '\r\n' | xargs)"
          driveId="$(printf '%s' "${GOOGLE_DRIVE_CLIENT_ID:-}" | tr -d ' \r\n')"
          driveSecret="$(printf '%s' "${GOOGLE_DRIVE_CLIENT_SECRET:-}" | tr -d ' \r\n')"
          dropboxId="$(printf '%s' "${DROPBOX_CLIENT_ID:-}" | tr -d ' \r\n')"
          dropboxSecret="$(printf '%s' "${DROPBOX_CLIENT_SECRET:-}" | tr -d ' \r\n')"
          adminEmail="$(printf '%s' "${AUTOTELEPROMPTER_ADMIN_EMAIL:-}" | tr -d '\r\n' | xargs)"
          adminCodeHash="$(printf '%s' "${AUTOTELEPROMPTER_ADMIN_CODE_SHA256:-}" | tr -d ' \r\n' | tr 'A-F' 'a-f')"
          updateManifestUrl="$(printf '%s' "${MACOS_UPDATE_MANIFEST_URL_SECRET:-}" | tr -d '\r\n' | xargs)"
          if [ -z "$updateManifestUrl" ]; then
            updateManifestUrl="$(printf '%s' "${MACOS_UPDATE_MANIFEST_URL_VAR:-}" | tr -d '\r\n' | xargs)"
          fi
          if [ -z "$updateManifestUrl" ]; then
            updateManifestUrl="${{ steps.release.outputs.manifest_url }}"
          fi
          # --- Channel logic mirrors Windows: backend on when Supabase present ---
          accountBackendEnabled="false"
          if [ -n "$supabaseUrl" ] && [ -n "$supabaseAnon" ]; then
            accountBackendEnabled="true"
          fi
          # Feedback routes via the Supabase edge function when the backend is
          # enabled, so leave the direct endpoint blank in that case (matches
          # Windows). Only used as a fallback for non-backend builds.
          if [ "$accountBackendEnabled" = "true" ]; then
            feedbackForBuild=""
          else
            feedbackForBuild="$(python3 ../.github/scripts/sanitize_feedback_endpoint.py "${FEEDBACK_ENDPOINT:-}")"
          fi
          # Admin bridge is only for non-backend builds (matches Windows):
          # blank the admin email/hash when the Supabase backend is enabled.
          if [ "$accountBackendEnabled" = "true" ]; then
            adminEmailForBuild=""
            adminCodeHashForBuild=""
          else
            adminEmailForBuild="$adminEmail"
            adminCodeHashForBuild="$adminCodeHash"
          fi
          echo "Account backend enabled: $accountBackendEnabled"
          flutter build macos --release \
            "--build-name=${{ steps.release.outputs.version_name }}" \
            "--build-number=${{ steps.release.outputs.build_number }}" \
            "--dart-define=APP_VERSION=${{ steps.release.outputs.app_version }}" \
            "--dart-define=UPDATE_PLATFORM=macos" \
            "--dart-define=ACCOUNT_BACKEND_ENABLED=$accountBackendEnabled" \
            "--dart-define=SUPABASE_URL=$supabaseUrl" \
            "--dart-define=SUPABASE_ANON_KEY=$supabaseAnon" \
            "--dart-define=FEEDBACK_ENDPOINT=$feedbackForBuild" \
            "--dart-define=GOOGLE_DRIVE_CLIENT_ID=$driveId" \
            "--dart-define=GOOGLE_DRIVE_CLIENT_SECRET=$driveSecret" \
            "--dart-define=DROPBOX_CLIENT_ID=$dropboxId" \
            "--dart-define=DROPBOX_CLIENT_SECRET=$dropboxSecret" \
            "--dart-define=DROPBOX_SYNC_ROOT_PATH=" \
            "--dart-define=AUTOTELEPROMPTER_ADMIN_EMAIL=$adminEmailForBuild" \
            "--dart-define=AUTOTELEPROMPTER_ADMIN_CODE_SHA256=$adminCodeHashForBuild" \
            "--dart-define=UPDATE_MANIFEST_URL=$updateManifestUrl"
        working-directory: Platform_macOS
        env:
          FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}
          DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_CLIENT_SECRET }}
          AUTOTELEPROMPTER_ADMIN_EMAIL: ${{ secrets.AUTOTELEPROMPTER_ADMIN_EMAIL }}
          AUTOTELEPROMPTER_ADMIN_CODE_SHA256: ${{ secrets.AUTOTELEPROMPTER_ADMIN_CODE_SHA256 }}
          MACOS_UPDATE_MANIFEST_URL_SECRET: ${{ secrets.MACOS_UPDATE_MANIFEST_URL }}
          MACOS_UPDATE_MANIFEST_URL_VAR: ${{ vars.MACOS_UPDATE_MANIFEST_URL }}

      - name: Zip App Bundle
        run: |
          cd Platform_macOS/build/macos/Build/Products/Release
          echo "App bundle size:"
          du -sh autoteleprompter.app
          echo "App bundle Contents breakdown:"
          du -sh autoteleprompter.app/Contents/* || true
          echo "Frameworks breakdown:"
          du -sh autoteleprompter.app/Contents/Frameworks/* || true
          ditto -c -k --sequesterRsrc --keepParent autoteleprompter.app "${{ steps.release.outputs.asset_name }}"
          echo "Zip size:"
          du -sh "${{ steps.release.outputs.asset_name }}"

      - name: Upload App
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.release.outputs.asset_name }}
          path: Platform_macOS/build/macos/Build/Products/Release/${{ steps.release.outputs.asset_name }}

      - name: Publish macOS Release
        env:
          GH_TOKEN: ${{ secrets.AUTOTELEPROMPTER_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "AUTOTELEPROMPTER_RELEASES_TOKEN is missing; skipping release publish."
            exit 0
          fi
          repo="${{ steps.release.outputs.release_repo }}"
          tag="${{ steps.release.outputs.tag }}"
          asset="Platform_macOS/build/macos/Build/Products/Release/${{ steps.release.outputs.asset_name }}"
          notesFile="$RUNNER_TEMP/macos-release-notes.md"
          cat > "$notesFile" <<'EOF'
          AutoTeleprompter macOS ${{ steps.release.outputs.app_version }}.

          Includes the premium feedback update for Mac: a versioned guided
          walkthrough with stable spotlights, Pro-gated Bookmarks suite,
          empty-script Present protection, improved Present/Content Creator
          readability, recording countdown sound cues, listening meter control,
          tooltip polish, speech-control setup defaults, safer fast-reading
          STT jump handling, resilient Apple STT recovery, duplicate Present
          route protection, and corrected Present word spacing.
          This build also pins the listening meter near the top of the
          presentation, improves low-volume next-word STT progression without
          relaxing large skip protection, detects stale Apple Speech audio
          callbacks, and adds build 31 Apple STT reliability mode so noisy
          rooms and far speakers are coached without overriding the user's
          saved speech-control profile thresholds.
          EOF
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --repo "$repo" --clobber
          else
            gh release create "$tag" "$asset" \
              --repo "$repo" \
              --title "${{ steps.release.outputs.release_title }}" \
              --notes-file "$notesFile"
          fi

      - name: Update macOS Manifest
        env:
          GH_TOKEN: ${{ secrets.AUTOTELEPROMPTER_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "AUTOTELEPROMPTER_RELEASES_TOKEN is missing; skipping manifest publish."
            exit 0
          fi
          repo="${{ steps.release.outputs.release_repo }}"
          manifestTag="${{ steps.release.outputs.manifest_tag }}"
          manifestAsset="${{ steps.release.outputs.manifest_asset }}"
          manifestDir="$RUNNER_TEMP/macos-manifest"
          manifestPath="$manifestDir/$manifestAsset"
          mkdir -p "$manifestDir"
          if ! gh release download "$manifestTag" --repo "$repo" \
            --pattern "$manifestAsset" --dir "$manifestDir" --clobber >/dev/null 2>&1; then
            printf '{"channels":{}}\n' > "$manifestPath"
          fi
          python3 - "$manifestPath" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path(sys.argv[1])
          try:
              manifest = json.loads(path.read_text())
          except Exception:
              manifest = {}
          channels = manifest.get("channels")
          if not isinstance(channels, dict):
              channels = {}
          channels["${{ steps.release.outputs.release_channel }}"] = {
              "version": "${{ steps.release.outputs.app_version }}",
              "platform": "macos",
              "url": "https://github.com/${{ steps.release.outputs.release_repo }}/releases/download/${{ steps.release.outputs.tag }}/${{ steps.release.outputs.asset_name }}",
              "notes": "Mac 5.0.8 adds the guided setup walkthrough, Pro-gated Bookmarks suite, empty-script Present protection, improved readability surfaces, recording countdown sound cues, listening meter control, tooltip polish, speech-control setup defaults, safer fast-reading STT jump handling, resilient Apple STT recovery, duplicate Present route protection, corrected Present word spacing, top-pinned listening meter placement, improved low-volume next-word STT progression, build 30 stale Apple Speech callback recovery, and build 31 Apple STT reliability mode for noisy rooms/far speakers without overriding saved speech-control profile thresholds.",
              "publishedAt": datetime.now(timezone.utc)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z"),
              "tag": "${{ steps.release.outputs.tag }}",
              "asset": "${{ steps.release.outputs.asset_name }}",
          }
          manifest = {
              "kind": "autoteleprompter.macos.update_manifest",
              "channels": channels,
          }
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          notesFile="$RUNNER_TEMP/macos-manifest-notes.md"
          echo "Machine-readable macOS update manifest for AutoTeleprompter." > "$notesFile"
          if gh release view "$manifestTag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$manifestTag" "$manifestPath" --repo "$repo" --clobber
          else
            gh release create "$manifestTag" "$manifestPath" \
              --repo "$repo" \
              --title "AutoTeleprompter macOS Update Manifest" \
              --notes-file "$notesFile"
          fi
