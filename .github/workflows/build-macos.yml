name: Build macOS App (v5.0.0)
run-name: macOS v5.0.0 App run ${{ github.run_number }} - ${{ github.event_name == 'workflow_dispatch' && 'manual dispatch' || github.event.head_commit.message }}

on:
  push:
    branches: [ main, master ]
    # Only trigger when macOS platform files or this workflow change.
    paths:
      - 'Platform_macOS/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build AutoTeleprompter for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install Dependencies
        run: flutter pub get
        working-directory: Platform_macOS

      - name: Verify macOS v5.0.0 metadata
        run: |
          grep -Fxq 'version: 5.0.0+11' pubspec.yaml
        working-directory: Platform_macOS

      - name: Patch Podfile Deployment Target
        # flutter pub get generates macos/Podfile with the old platform version.
        # whisper_flutter_new requires macOS 10.15. Force it here before pod install runs.
        run: |
          sed -i '' "s/platform :osx, '[0-9.]*'/platform :osx, '11.0'/" Platform_macOS/macos/Podfile
          head -3 Platform_macOS/macos/Podfile

      - name: Build macOS App
        run: |
          endpoint="$(python3 ../.github/scripts/sanitize_feedback_endpoint.py "$FEEDBACK_ENDPOINT")"
          flutter build macos --release "--dart-define=APP_VERSION=5.0.0+11" "--dart-define=FEEDBACK_ENDPOINT=$endpoint"
        working-directory: Platform_macOS
        env:
          FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}

      - name: Zip App Bundle
        run: |
          cd Platform_macOS/build/macos/Build/Products/Release
          echo "App bundle size:"
          du -sh autoteleprompter.app
          echo "App bundle Contents breakdown:"
          du -sh autoteleprompter.app/Contents/* || true
          echo "Frameworks breakdown:"
          du -sh autoteleprompter.app/Contents/Frameworks/* || true
          ditto -c -k --sequesterRsrc --keepParent autoteleprompter.app AutoTeleprompter-macOS-v5.0.0.zip
          echo "Zip size:"
          du -sh AutoTeleprompter-macOS-v5.0.0.zip

      - name: Upload App
        uses: actions/upload-artifact@v7
        with:
          name: AutoTeleprompter-macOS-v5.0.0
          path: Platform_macOS/build/macos/Build/Products/Release/AutoTeleprompter-macOS-v5.0.0.zip
