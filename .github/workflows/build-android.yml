name: Build Android APK (v5.0.0)
run-name: Android v5.0.0 APK #${{ github.run_number }} - ${{ github.event_name == 'workflow_dispatch' && 'manual dispatch' || github.event.head_commit.message }}

on:
  push:
    branches: [ main, master ]
    # Only trigger when Android platform files or this workflow change.
    paths:
      - 'Platform_Android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build AutoTeleprompter for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install NDK 27
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.11902837"

      - name: Install Dependencies
        run: flutter pub get
        working-directory: Platform_Android

      - name: Verify Android v5.0.0 metadata
        run: |
          grep -Fxq 'version: 5.0.0+1' pubspec.yaml
        working-directory: Platform_Android

      - name: Build Android APK (Release, split ABI)
        run: flutter build apk --release --target-platform android-arm,android-arm64 --split-per-abi
        working-directory: Platform_Android

      - name: Rename Android APKs
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/AutoTeleprompter-Android-v5.0.0-arm64-v8a-release.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/AutoTeleprompter-Android-v5.0.0-armeabi-v7a-release.apk
        working-directory: Platform_Android

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: AutoTeleprompter-Android-v5.0.0-APK
          path: |
            Platform_Android/build/app/outputs/flutter-apk/AutoTeleprompter-Android-v5.0.0-arm64-v8a-release.apk
            Platform_Android/build/app/outputs/flutter-apk/AutoTeleprompter-Android-v5.0.0-armeabi-v7a-release.apk
