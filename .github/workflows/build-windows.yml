name: Build Windows EXE (v5.0.2)
run-name: Windows v5.0.2 EXE - ${{ github.event_name == 'workflow_dispatch' && 'manual dispatch' || github.event.head_commit.message }}

on:
  push:
    branches: [ main, master ]
    # Only trigger when Windows platform files or this workflow change.
    paths:
      - 'Platform_Windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build AutoTeleprompter for Windows
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Sync Dependencies
        run: flutter pub get
        working-directory: Platform_Windows

      - name: Build Windows Archive
        run: |
          $symbols = Join-Path $env:RUNNER_TEMP "autoteleprompter-symbols\windows-v5.0.2"
          New-Item -ItemType Directory -Force -Path $symbols | Out-Null
          flutter build windows --release --obfuscate --split-debug-info="$symbols" --dart-define=APP_VERSION=5.0.2+17 --dart-define=FEEDBACK_ENDPOINT="$env:FEEDBACK_ENDPOINT"
        working-directory: Platform_Windows
        env:
          FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}

      - name: Package Artifacts
        run: |
          mkdir build-zip
          xcopy /E /I Platform_Windows\build\windows\x64\runner\Release build-zip\AutoTeleprompter-Windows
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AutoTeleprompter-Windows-v5.0.2-EXE
          path: build-zip\AutoTeleprompter-Windows
