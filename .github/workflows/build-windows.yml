name: Build Windows EXE (v5.0.5)
run-name: Windows v5.0.5 EXE - ${{ github.event_name == 'workflow_dispatch' && 'manual dispatch' || github.event.head_commit.message }}

on:
  push:
    branches: [ main, master ]
    # Only trigger when Windows platform files or this workflow change.
    paths:
      - 'Platform_Windows/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build AutoTeleprompter for Windows
    runs-on: windows-2022

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Sync Dependencies
        run: flutter pub get
        working-directory: Platform_Windows

      - name: Build Windows Archive
        run: |
          $symbols = Join-Path $env:RUNNER_TEMP "autoteleprompter-symbols\windows-v5.0.5"
          New-Item -ItemType Directory -Force -Path $symbols | Out-Null
          function Remove-ClientCredentialQuery([string] $value) {
            $clean = ($value -replace "`r", "" -replace "`n", "").Trim()
            if ([string]::IsNullOrWhiteSpace($clean)) { return "" }
            try {
              $uri = [Uri] $clean
              if ([string]::IsNullOrWhiteSpace($uri.Query)) { return $clean }
              $blockedNames = @(
                "token",
                "access_token",
                "api_key",
                "apikey",
                "key",
                "secret",
                "client_secret",
                "auth"
              )
              $pairs = $uri.Query.TrimStart("?").Split("&", [System.StringSplitOptions]::RemoveEmptyEntries)
              $kept = New-Object System.Collections.Generic.List[string]
              $removed = $false
              foreach ($pair in $pairs) {
                $name = [Uri]::UnescapeDataString(($pair -split "=", 2)[0]).ToLowerInvariant()
                if ($blockedNames -contains $name) {
                  $removed = $true
                } else {
                  $kept.Add($pair)
                }
              }
              if (-not $removed) { return $clean }
              Write-Warning "Removed token-like query parameter from FEEDBACK_ENDPOINT before compiling the public artifact."
              $builder = [UriBuilder] $uri
              $builder.Query = ($kept -join "&")
              return $builder.Uri.AbsoluteUri
            } catch {
              return $clean
            }
          }
          $endpoint = ($env:FEEDBACK_ENDPOINT -replace "`r", "" -replace "`n", "").Trim()
          $endpoint = Remove-ClientCredentialQuery $endpoint
          $googleDriveClientId = ($env:GOOGLE_DRIVE_CLIENT_ID -replace "\s", "").Trim()
          $dropboxClientId = ($env:DROPBOX_CLIENT_ID -replace "\s", "").Trim()
          if (-not [string]::IsNullOrWhiteSpace($googleDriveClientId) -and
              $googleDriveClientId -notmatch '^\d+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$') {
            throw "GOOGLE_DRIVE_CLIENT_ID is malformed. Use the OAuth Desktop app Client ID ending in .apps.googleusercontent.com."
          }
          flutter build windows --release --obfuscate --split-debug-info="$symbols" --dart-define=APP_VERSION=5.0.5+20 --dart-define=FEEDBACK_ENDPOINT="$endpoint" --dart-define=GOOGLE_DRIVE_CLIENT_ID="$googleDriveClientId" --dart-define=DROPBOX_CLIENT_ID="$dropboxClientId"
        working-directory: Platform_Windows
        env:
          FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_CLIENT_ID }}

      - name: Package Artifacts
        run: |
          mkdir build-zip
          xcopy /E /I Platform_Windows\build\windows\x64\runner\Release build-zip\AutoTeleprompter-Windows
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AutoTeleprompter-Windows-v5.0.5-EXE
          path: build-zip\AutoTeleprompter-Windows
